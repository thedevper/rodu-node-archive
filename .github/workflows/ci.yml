name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  binaries:
    # Builds every target here: macOS binaries must be signed on a Mac.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
          # The install commands in the README must point at this release's scripts.
          [ "$(grep -c "TheDevper/shoal/v$version/packaging/install" README.md)" = 2 ] ||
            { echo "README install URLs do not name v$version"; exit 1; }
      - run: pnpm build:binaries
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  smoke:
    # Installs each binary with the same script users run, on its own OS, and drives it.
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: macos-15-intel
          - os: windows-latest
            shell: powershell
          - os: windows-latest
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.11.0
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Install with install.sh and smoke test
        if: runner.os == 'macOS'
        run: |
          export SHOAL_VERSION=$(node -p "require('./apps/cli/package.json').version")
          export SHOAL_BIN_DIR="$RUNNER_TEMP/bin"
          export SHOAL_DOWNLOAD_BASE="file://$GITHUB_WORKSPACE/dist/release"
          sh packaging/install.sh
          node scripts/smoke-binary.ts "$RUNNER_TEMP/bin/shoal"
      - name: Install the way users do (irm | iex) and smoke test
        if: runner.os == 'Windows'
        shell: ${{ matrix.shell }}
        run: |
          $env:SHOAL_VERSION = node -p "require('./apps/cli/package.json').version"
          $env:SHOAL_INSTALL_DIR = "$env:RUNNER_TEMP\shoal"
          $env:SHOAL_DOWNLOAD_BASE = "$env:GITHUB_WORKSPACE\dist\release"
          # An expandable entry like the Windows default %USERPROFILE%\...\WindowsApps must survive.
          $key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey('Environment', $true)
          $before = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          $key.SetValue('Path', ($before.TrimEnd(';') + ';%USERPROFILE%\shoal-ci-marker').TrimStart(';'), 'ExpandString')
          Get-Content -Raw packaging/install.ps1 | Invoke-Expression
          $after = [string]$key.GetValue('Path', '', 'DoNotExpandEnvironmentNames')
          if ($key.GetValueKind('Path') -ne 'ExpandString') { throw 'user PATH lost REG_EXPAND_SZ' }
          if ($after -notlike '*%USERPROFILE%\shoal-ci-marker*') { throw "user PATH was expanded: $after" }
          if ($after -notlike "*$env:SHOAL_INSTALL_DIR*") { throw 'install dir not on user PATH' }
          # A second run upgrades in place while shoal.exe is running.
          $ws = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\ws"
          Push-Location $ws; shoal init --name ci --key CI; Pop-Location
          $running = Start-Process -PassThru -WindowStyle Hidden -WorkingDirectory $ws "$env:SHOAL_INSTALL_DIR\shoal.exe" -ArgumentList 'web', '--no-open', '--port', '0'
          Start-Sleep -Seconds 2
          if ($running.HasExited) { throw 'shoal web did not keep running' }
          Get-Content -Raw packaging/install.ps1 | Invoke-Expression
          # Again, while the first renamed copy is still running.
          Get-Content -Raw packaging/install.ps1 | Invoke-Expression
          Stop-Process -Id $running.Id -Force
          shoal --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/smoke-binary.ts "$env:SHOAL_INSTALL_DIR\shoal.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
